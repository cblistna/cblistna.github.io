<!DOCTYPE html>
<html lang="cz">
  <head>
    <meta name="robots" content="noindex" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Události</title>
    <link rel="stylesheet" href="../css/tailwind2.min.css" />
    <style>
      html {
        scroll-snap-type: y;
      }

      .slide {
        min-height: 100vh;
        scroll-snap-align: start;
      }

      .event-description a {
        color: #93c5fd;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.15em;
      }

      .event-description a:hover {
        color: #bfdbfe;
      }

      #presenter-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        overflow: auto;
        padding: 1rem;
        background: rgba(3, 7, 18, 0.97);
      }

      body.presenter-mode {
        overflow: hidden;
      }

      body.presenter-mode #presenter-overlay {
        display: block;
      }

      .presenter-toolbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 0 1rem;
        background: linear-gradient(rgba(3, 7, 18, 0.98), rgba(3, 7, 18, 0.88));
        backdrop-filter: blur(10px);
      }

      .presenter-status {
        font-size: 1.125rem;
        font-weight: 600;
      }

      .presenter-help {
        color: #cbd5e1;
        font-size: 0.875rem;
        text-align: right;
      }

      #presenter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
        align-items: start;
      }

      .presenter-thumb {
        border: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: 0.9rem;
        padding: 0.75rem;
        background: rgba(17, 24, 39, 0.96);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        cursor: pointer;
        transition: border-color 0.16s ease, box-shadow 0.16s ease,
          transform 0.16s ease;
      }

      .presenter-thumb:hover {
        transform: translateY(-2px);
        border-color: rgba(191, 219, 254, 0.7);
      }

      .presenter-thumb.is-active {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.28),
          0 24px 48px rgba(0, 0, 0, 0.32);
      }

      .presenter-thumb-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.6rem;
        color: #e5e7eb;
        font-size: 0.95rem;
      }

      .presenter-thumb-label {
        font-weight: 600;
      }

      .presenter-thumb-stage {
        overflow: hidden;
        border-radius: 0.7rem;
        background: #111827;
      }

      .presenter-thumb-inner {
        transform-origin: top left;
        pointer-events: none;
      }

      .slide-shell {
        box-sizing: border-box;
        width: 100vw;
        min-height: 100vh;
        padding-left: 0.75rem;
        padding-right: 0.75rem;
        background: #111827;
        color: #fff;
        overflow-x: hidden;
        line-height: 1.375;
      }

      @media (min-width: 640px) {
        .slide-shell {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
          line-height: 1.5;
        }
      }

      @media (min-width: 1024px) {
        .slide-shell {
          padding-left: 2.5rem;
          padding-right: 2.5rem;
        }
      }

      .slide-shell .slide {
        min-height: 100vh;
      }

      #audience-stage {
        position: fixed;
        inset: 0;
        z-index: 1100;
        display: none;
        overflow: auto;
        background: #111827;
      }

      body.audience-mode {
        overflow: hidden;
      }

      body.audience-mode #audience-stage {
        display: block;
      }

      .audience-slide {
        min-height: 100vh;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-white px-3 sm:px-6 lg:px-10 overflow-x-hidden leading-snug sm:leading-normal">
    <div id="events-title" class="flex slide">
      <p id="title" class="text-4xl sm:text-6xl lg:text-8xl pt-2 sm:pt-4 font-semibold m-auto text-center leading-tight">
        Oznámení
        <span class="text-3xl sm:text-4xl lg:text-6xl font-light block pt-2 sm:pt-3" id="sunday"></span>
        <span class="text-2xl sm:text-3xl lg:text-5xl font-medium block text-center pt-4 sm:pt-8"
          >cblistna.cz</span
        >
      </p>
    </div>

    <div id="next-week-events" class="slide pt-1">
      <p
        class="text-base sm:text-xl lg:text-2xl text-right bg-gray-700 text-white -mx-3 sm:-mx-6 lg:-mx-10 pr-3 sm:pr-6 lg:pr-10 py-2 mt-4 mb-4"
      >
        Pravidelná setkání v příštím týdnu
      </p>
      <div class="-mt-4" id="next-week-calendar"></div>
    </div>

    <div id="upcoming-events"></div>

    <div id="promo-events" class="slide pt-1">
      <p
        class="text-base sm:text-xl lg:text-2xl text-right bg-gray-700 text-white -mx-3 sm:-mx-6 lg:-mx-10 pr-3 sm:pr-6 lg:pr-10 py-2 mt-4 mb-4"
      >
        Jiné události
      </p>
      <div class="-mt-4" id="promo-events-calendar"></div>
    </div>

    <div id="planned-events" class="slide pt-1">
      <p
        class="text-base sm:text-xl lg:text-2xl text-right bg-gray-700 text-white -mx-3 sm:-mx-6 lg:-mx-10 pr-3 sm:pr-6 lg:pr-10 py-2 mt-4 mb-4"
      >
        Plánované události
      </p>
      <div class="-mt-4" id="planned-events-calendar"></div>
    </div>

    <script type="module">
      import {
        fetchCombinedEvents,
        czDateTimeOf,
        today,
        toLocalDate,
      } from "../js/calendar.js";

      function attachmentHref(attachment) {
        if (attachment.directUrl) {
          const viewerUrl = new URL("image.html", window.location.href);
          viewerUrl.searchParams.set("src", attachment.directUrl);
          const fallback = attachment.url || attachment.webViewLink;
          if (fallback) {
            viewerUrl.searchParams.set("fallback", fallback);
          }
          return viewerUrl.toString();
        }
        return attachment.url || attachment.webViewLink;
      }

      function addBlankTargetToLinks(html) {
        const wrapper = document.createElement("div");
        wrapper.innerHTML = html;
        wrapper.querySelectorAll("a[href]").forEach((anchor) => {
          anchor.setAttribute("target", "_blank");
          anchor.setAttribute("rel", "noopener noreferrer");
        });
        return wrapper.innerHTML;
      }

      function CalendarDay(day) {
        const eventsHtml = day.events
          .map((event) => {
            const eventDateTime = czDateTimeOf(event.start);
            const timeDisplay = eventDateTime.time
              ? eventDateTime.time.split(":")[0]
              : "";
            const minutesDisplay = eventDateTime.time
              ? "." + eventDateTime.time.split(":")[1]
              : "";

            const attachmentsHtml =
              event.attachments && event.attachments.length > 0
                ? event.attachments
                    .map(
                      (attachment) =>
                        `<br/><a href="${
                          attachmentHref(attachment)
                        }" target="_blank" class="block sm:inline ml-8 sm:ml-16 lg:ml-24 sm:pl-2 text-blue-400 break-words">${
                          attachment.label
                        }</a>`
                    )
                    .join("")
                : "";

            const descriptionHtml = event.body
              ? `<span class="event-description block sm:inline mt-1 sm:mt-0 text-base sm:text-2xl lg:text-4xl ml-4 sm:ml-5 text-gray-300 font-light leading-relaxed">${addBlankTargetToLinks(
                  event.body
                )}</span>`
              : "";

            // Add service information if available
            let serviceInfo = "";
            if (
              event.tags.svc &&
              (event.tags.moderator || event.tags.teacher)
            ) {
              const parts = [];
              if (event.tags.moderator)
                parts.push(`Vedení: ${event.tags.moderator}`);
              if (event.tags.teacher)
                parts.push(`Slovo: ${event.tags.teacher}`);
              serviceInfo = `<span class="block sm:inline mt-1 sm:mt-0 text-base sm:text-2xl lg:text-4xl ml-4 sm:ml-5 text-gray-300 font-light leading-relaxed">${parts.join(
                ", "
              )}</span>`;
            }

            return `
            <p class="mt-3 sm:mt-4">
              <span class="inline-block w-8 sm:w-10 font-normal text-2xl sm:text-3xl lg:text-4xl">
                ${timeDisplay}<span class="text-xl sm:text-2xl lg:text-3xl font-normal">${minutesDisplay}</span>
              </span>
              <span class="block sm:inline ml-4 sm:ml-8 lg:ml-14 font-medium text-2xl sm:text-4xl lg:text-5xl leading-tight">${event.subject}${
              event.duration.spanDays > 1
                ? ` (${event.duration.spanDays}d)`
                : ""
            }</span>
              ${descriptionHtml}
              ${serviceInfo}
              ${attachmentsHtml}
            </p>
          `;
          })
          .join("");

        return `
          <div class="mt-6 sm:mt-10">
            <p class="text-2xl sm:text-3xl lg:text-4xl font-normal">
              ${day.date.weekday.toLowerCase()}, ${
          day.date.day
        }. ${day.date.monthName.toLowerCase()}
            </p>
            ${eventsHtml}
          </div>
        `;
      }

      function EventHighlight(event) {
        const eventDateTime = czDateTimeOf(event.start);
        const timeDisplay = eventDateTime.time ? `v ${eventDateTime.time}` : "";
        const descriptionHtml = event.body
          ? `<span class="event-description block pt-2 text-base sm:text-2xl lg:text-4xl text-gray-300 font-light leading-relaxed">${addBlankTargetToLinks(
              event.body
            )}</span>`
          : "";

        const attachmentsHtml =
          event.attachments && event.attachments.length > 0
            ? event.attachments
                .map(
                  (attachment) =>
                    `<span class="block pt-2 text-blue-400 break-words"><a href="${
                      attachmentHref(attachment)
                    }" target="_blank">${attachment.label}</a></span>`
                )
                .join("")
            : "";

        return `
          <div class="slide pt-1">
            <p class="text-base sm:text-xl lg:text-2xl text-right bg-gray-700 text-white -mx-3 sm:-mx-6 lg:-mx-10 pr-3 sm:pr-6 lg:pr-10 py-2 mt-4 mb-4">
              Nadcházející události
            </p>
            <div class="min-h-screen flex flex-col justify-center">
              <div class="pb-24 sm:pb-40 lg:pb-64 px-6 sm:px-12 lg:px-24">
                <p class="pb-4 sm:pb-6 lg:pb-8 text-2xl sm:text-4xl lg:text-6xl font-normal">
                  ${eventDateTime.weekday.toLowerCase()}, ${
          eventDateTime.day
        }. ${eventDateTime.monthName.toLowerCase()} ${timeDisplay}
                </p>
                <p class="text-base sm:text-xl lg:text-2xl mb-2">
                  <span class="block font-semibold text-3xl sm:text-5xl lg:text-8xl pb-2 leading-tight">${
                    event.subject
                  }</span>
                  ${descriptionHtml}
                  ${attachmentsHtml}
                </p>
              </div>
            </div>
          </div>
        `;
      }

      function clipTo(start, end) {
        return (event) => {
          const eventDate = event.start.substring(0, 10);
          return eventDate >= start && (!end ? true : eventDate <= end);
        };
      }

      function startsWithinPresentationWindow(event, sundayDate) {
        const eventDate = event.start.substring(0, 10);

        if (eventDate > sundayDate) {
          return true;
        }

        if (eventDate < sundayDate) {
          return false;
        }

        return event.start.length === 10 || event.start >= `${sundayDate} 12:00`;
      }

      function calendarOf(events) {
        return Object.entries(
          events.reduce((acc, event) => {
            const dateKey = event.start.substring(0, 10);
            if (!acc[dateKey]) {
              acc[dateKey] = [];
            }
            acc[dateKey].push(event);
            return acc;
          }, {})
        ).map(([date, events]) => ({ date, events }));
      }

      function renderCalendarTo(elementId, events) {
        const target = document.getElementById(elementId);
        if (!target) return;
        if (!events || events.length === 0) {
          target.parentElement.remove();
          return;
        }
        target.innerHTML = calendarOf(events)
          .map(({ date, events }) => ({ date: czDateTimeOf(date), events }))
          .map(CalendarDay)
          .join("\n");
      }

      function addDays(dateStr, days) {
        const date = new Date(dateStr + "T00:00:00");
        date.setDate(date.getDate() + days);
        return toLocalDate(date);
      }

      function weekOf(referenceDate) {
        const refDate = new Date(referenceDate + "T00:00:00");
        const dayOfWeek = refDate.getDay();

        const mon = new Date(refDate);
        const diff = mon.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
        mon.setDate(diff);

        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);

        const monday = toLocalDate(mon);
        const sunday = toLocalDate(sun);

        return {
          prev: {
            monday: addDays(monday, -7),
            sunday: addDays(sunday, -7),
          },
          monday,
          sunday,
          next: {
            monday: addDays(monday, 7),
            sunday: addDays(sunday, 7),
          },
        };
      }

      const presenterState = {
        slides: [],
        activeSlideIndex: 0,
        presenterMode: false,
        audienceMode: false,
        presenterOverlay: null,
        presenterGrid: null,
        presenterStatus: null,
        presenterThumbs: [],
        audienceStage: null,
        audienceWindow: null,
        audienceWindowAvailable: true,
        channel:
          typeof BroadcastChannel !== "undefined"
            ? new BroadcastChannel("events-presenter")
            : null,
      };

      function presenterAudienceMode() {
        return new URL(window.location.href).searchParams.get("audience") === "1";
      }

      function refreshSlides() {
        presenterState.slides = Array.from(document.querySelectorAll(".slide"));
        return presenterState.slides;
      }

      function clampSlideIndex(index) {
        if (presenterState.slides.length === 0) return 0;
        return Math.max(0, Math.min(index, presenterState.slides.length - 1));
      }

      function slideOffsetTop(slide) {
        const rect = slide.getBoundingClientRect();
        return rect.top + window.pageYOffset;
      }

      function syncScrollToSlide(index, behavior = "auto") {
        const slide = presenterState.slides[index];
        if (!slide) return;
        window.scrollTo({ top: slideOffsetTop(slide), behavior });
      }

      function detectCurrentSlideIndex() {
        if (presenterState.slides.length === 0) return 0;

        const viewportCenter = window.innerHeight / 2;
        let activeIndex = 0;
        let closestDistance = Number.POSITIVE_INFINITY;

        presenterState.slides.forEach((slide, index) => {
          const rect = slide.getBoundingClientRect();
          const center = rect.top + Math.min(rect.height, window.innerHeight) / 2;
          const distance = Math.abs(center - viewportCenter);

          if (distance < closestDistance) {
            closestDistance = distance;
            activeIndex = index;
          }
        });

        return activeIndex;
      }

      function slideHeight(slide) {
        return Math.max(slide.getBoundingClientRect().height, window.innerHeight);
      }

      function createSlideShell(slide) {
        const shell = document.createElement("div");
        shell.className = "slide-shell";

        const clone = slide.cloneNode(true);
        clone.removeAttribute("id");
        clone.querySelectorAll("[id]").forEach((element) => {
          element.removeAttribute("id");
        });

        shell.appendChild(clone);
        return shell;
      }

      function ensurePresenterOverlay() {
        if (presenterState.presenterOverlay) return;

        const overlay = document.createElement("div");
        overlay.id = "presenter-overlay";
        overlay.innerHTML = `
          <div class="presenter-toolbar">
            <div class="presenter-status"></div>
            <div class="presenter-help">P zavre, sipky meni snimek, klik vybere snimek</div>
          </div>
          <div id="presenter-grid"></div>
        `;

        document.body.appendChild(overlay);
        presenterState.presenterOverlay = overlay;
        presenterState.presenterGrid = overlay.querySelector("#presenter-grid");
        presenterState.presenterStatus = overlay.querySelector(".presenter-status");
      }

      function ensureAudienceStage() {
        if (presenterState.audienceStage) return;

        const stage = document.createElement("div");
        stage.id = "audience-stage";
        document.body.appendChild(stage);
        presenterState.audienceStage = stage;
      }

      function updatePresenterThumbLayouts() {
        presenterState.presenterThumbs.forEach((thumb, index) => {
          const slide = presenterState.slides[index];
          const stage = thumb.querySelector(".presenter-thumb-stage");
          const inner = thumb.querySelector(".presenter-thumb-inner");
          if (!slide || !stage || !inner) return;

          const width = window.innerWidth;
          const height = slideHeight(slide);
          const stageWidth = stage.clientWidth || 320;
          const scale = stageWidth / width;

          stage.style.height = `${height * scale}px`;
          inner.style.width = `${width}px`;
          inner.style.height = `${height}px`;
          inner.style.transform = `scale(${scale})`;
        });
      }

      function updatePresenterStatus() {
        if (!presenterState.presenterStatus) return;

        const suffix = presenterState.audienceWindowAvailable
          ? ""
          : " | druhe okno bylo zablokovano";

        presenterState.presenterStatus.textContent = `Snimek ${
          presenterState.activeSlideIndex + 1
        } / ${presenterState.slides.length}${suffix}`;
      }

      function updatePresenterOverview() {
        presenterState.presenterThumbs.forEach((thumb, index) => {
          thumb.classList.toggle("is-active", index === presenterState.activeSlideIndex);
        });
        updatePresenterStatus();
      }

      function renderPresenterOverview() {
        ensurePresenterOverlay();
        presenterState.presenterGrid.replaceChildren();
        presenterState.presenterThumbs = presenterState.slides.map((slide, index) => {
          const thumb = document.createElement("div");
          thumb.className = "presenter-thumb";
          thumb.tabIndex = 0;

          const meta = document.createElement("div");
          meta.className = "presenter-thumb-meta";
          meta.innerHTML = `
            <span class="presenter-thumb-label">Snimek ${index + 1}</span>
            <span>${slide.id || "udalosti"}</span>
          `;

          const stage = document.createElement("div");
          stage.className = "presenter-thumb-stage";

          const inner = document.createElement("div");
          inner.className = "presenter-thumb-inner";
          inner.appendChild(createSlideShell(slide));
          stage.appendChild(inner);

          thumb.appendChild(meta);
          thumb.appendChild(stage);

          thumb.addEventListener("click", () => {
            setActiveSlide(index);
          });

          thumb.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              setActiveSlide(index);
            }
          });

          presenterState.presenterGrid.appendChild(thumb);
          return thumb;
        });

        updatePresenterThumbLayouts();
        updatePresenterOverview();
      }

      function renderAudienceSlide() {
        if (!presenterState.audienceMode) return;

        ensureAudienceStage();
        const slide = presenterState.slides[presenterState.activeSlideIndex];
        if (!slide) return;

        const wrapper = document.createElement("div");
        wrapper.className = "audience-slide";
        wrapper.appendChild(createSlideShell(slide));
        presenterState.audienceStage.replaceChildren(wrapper);
      }

      function broadcastPresenterState() {
        presenterState.channel?.postMessage({
          type: "presenter-state",
          presenterMode: presenterState.presenterMode,
          slideIndex: presenterState.activeSlideIndex,
        });
      }

      function audienceWindowUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set("audience", "1");
        url.searchParams.set("slide", String(presenterState.activeSlideIndex));
        return url.toString();
      }

      function openAudienceWindow() {
        if (
          presenterState.audienceWindow &&
          !presenterState.audienceWindow.closed
        ) {
          presenterState.audienceWindow.focus();
          return;
        }

        presenterState.audienceWindow = window.open(
          audienceWindowUrl(),
          "events-audience-screen",
          "popup,width=1280,height=720"
        );

        presenterState.audienceWindowAvailable = !!presenterState.audienceWindow;
      }

      function setActiveSlide(index) {
        presenterState.activeSlideIndex = clampSlideIndex(index);
        syncScrollToSlide(
          presenterState.activeSlideIndex,
          presenterState.presenterMode ? "auto" : "smooth"
        );

        if (presenterState.presenterMode) {
          updatePresenterOverview();
          broadcastPresenterState();
        }

        if (presenterState.audienceMode) {
          renderAudienceSlide();
        }
      }

      function dispatchModeChange() {
        document.dispatchEvent(
          new CustomEvent("events:modechange", {
            detail: {
              presenterMode: presenterState.presenterMode,
              audienceMode: presenterState.audienceMode,
            },
          })
        );
      }

      function enterPresenterMode() {
        refreshSlides();
        if (presenterState.slides.length === 0) return;

        presenterState.presenterMode = true;
        presenterState.activeSlideIndex = detectCurrentSlideIndex();
        presenterState.audienceWindowAvailable = true;

        document.body.classList.add("presenter-mode");
        renderPresenterOverview();
        syncScrollToSlide(presenterState.activeSlideIndex);
        openAudienceWindow();
        updatePresenterStatus();
        broadcastPresenterState();
        dispatchModeChange();
      }

      function exitPresenterMode() {
        if (!presenterState.presenterMode) return;

        presenterState.presenterMode = false;
        document.body.classList.remove("presenter-mode");
        broadcastPresenterState();
        dispatchModeChange();

        if (
          presenterState.audienceWindow &&
          !presenterState.audienceWindow.closed
        ) {
          presenterState.audienceWindow.close();
        }

        syncScrollToSlide(presenterState.activeSlideIndex);
      }

      function navigateSlide(offset) {
        setActiveSlide(presenterState.activeSlideIndex + offset);
      }

      function setupPresentation() {
        refreshSlides();
        presenterState.audienceMode = presenterAudienceMode();

        presenterState.channel?.addEventListener("message", ({ data }) => {
          if (!data || data.type !== "presenter-state") return;
          if (!presenterState.audienceMode) return;

          presenterState.activeSlideIndex = clampSlideIndex(data.slideIndex || 0);
          renderAudienceSlide();

          if (data.presenterMode === false) {
            window.close();
          }
        });

        document.addEventListener("keydown", (event) => {
          const target = event.target;
          if (
            target instanceof HTMLElement &&
            (target.isContentEditable ||
              ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName))
          ) {
            return;
          }

          if (event.key === "P" && !presenterState.audienceMode) {
            event.preventDefault();
            if (presenterState.presenterMode) {
              exitPresenterMode();
            } else {
              enterPresenterMode();
            }
            return;
          }

          if (event.key === "Escape") {
            if (presenterState.presenterMode) {
              event.preventDefault();
              exitPresenterMode();
            } else if (presenterState.audienceMode) {
              event.preventDefault();
              window.close();
            }
            return;
          }

          if (presenterState.presenterMode) {
            if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) {
              event.preventDefault();
              navigateSlide(1);
              return;
            }

            if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(event.key)) {
              event.preventDefault();
              navigateSlide(-1);
              return;
            }

            if (event.key === "Home") {
              event.preventDefault();
              setActiveSlide(0);
              return;
            }

            if (event.key === "End") {
              event.preventDefault();
              setActiveSlide(presenterState.slides.length - 1);
            }
          }
        });

        window.addEventListener("resize", () => {
          if (presenterState.presenterMode) {
            updatePresenterThumbLayouts();
          }
          if (presenterState.audienceMode) {
            renderAudienceSlide();
          }
        });

        window.addEventListener("scroll", () => {
          if (presenterState.presenterMode || presenterState.audienceMode) return;
          presenterState.activeSlideIndex = detectCurrentSlideIndex();
        });

        if (presenterState.audienceMode) {
          document.body.classList.add("audience-mode");
          const url = new URL(window.location.href);
          presenterState.activeSlideIndex = clampSlideIndex(
            parseInt(url.searchParams.get("slide"), 10) || 0
          );
          renderAudienceSlide();
        }

        dispatchModeChange();
      }

      async function main() {
        try {
          const url = new URL(window.location.href);
          let referenceDate = today();

          if (url.searchParams.has("w")) {
            const weekOffset = parseInt(url.searchParams.get("w")) || 0;
            referenceDate = addDays(referenceDate, weekOffset * 7);
          }

          const week = weekOf(referenceDate);

          const sunday = czDateTimeOf(week.sunday + " 00:00");
          document.getElementById("sunday").textContent = `${
            sunday.day
          }. ${sunday.monthName.toLowerCase()} ${sunday.year}`;

          const events = await fetchCombinedEvents(week.sunday + " 11:00");

          renderCalendarTo(
            "next-week-calendar",
            events
              .filter(clipTo(week.sunday, week.next.sunday))
              .filter((event) => startsWithinPresentationWindow(event, week.sunday))
              .filter((event) => event.recurring)
          );

          events
            .filter((event) => startsWithinPresentationWindow(event, week.sunday))
            .filter(
              ({ recurring, tags: t }) => !recurring && !t.plan && !t.promo
            )
            .forEach((event) => {
              document.getElementById("upcoming-events").innerHTML +=
                EventHighlight(event);
            });

          renderCalendarTo(
            "promo-events-calendar",
            events
              .filter((event) => startsWithinPresentationWindow(event, week.sunday))
              .filter((event) => event.tags.promo)
          );

          renderCalendarTo(
            "planned-events-calendar",
            events
              .filter((event) => startsWithinPresentationWindow(event, week.sunday))
              .filter((event) => event.tags.plan)
          );
        } catch (error) {
          console.error("Error loading events:", error);
        } finally {
          setupPresentation();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", main);
      } else {
        main();
      }
    </script>

    <script src="autoscroll.js"></script>
  </body>
</html>
